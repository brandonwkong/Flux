version: "3.8"

services:
  # Redis for state persistence (optional, for future phases)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Scheduler service
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Worker 1
  worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    ports:
      - "8001:8001"
    environment:
      - SCHEDULER_URL=http://scheduler:8000
      - WORKER_NAME=worker-1
      - WORKER_HOST=worker-1
      - WORKER_PORT=8001
      - WORKER_CPU=4
      - WORKER_MEMORY=4096
      - WORKER_GPU=0
    depends_on:
      scheduler:
        condition: service_healthy

  # Worker 2
  worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    ports:
      - "8002:8001"
    environment:
      - SCHEDULER_URL=http://scheduler:8000
      - WORKER_NAME=worker-2
      - WORKER_HOST=worker-2
      - WORKER_PORT=8001
      - WORKER_CPU=4
      - WORKER_MEMORY=4096
      - WORKER_GPU=0
    depends_on:
      scheduler:
        condition: service_healthy

  # Worker 3
  worker-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    ports:
      - "8003:8001"
    environment:
      - SCHEDULER_URL=http://scheduler:8000
      - WORKER_NAME=worker-3
      - WORKER_HOST=worker-3
      - WORKER_PORT=8001
      - WORKER_CPU=8
      - WORKER_MEMORY=8192
      - WORKER_GPU=1
    depends_on:
      scheduler:
        condition: service_healthy

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - scheduler

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  grafana-data:
